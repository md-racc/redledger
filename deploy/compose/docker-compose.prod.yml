# Historical production overlay, retained for deliberate self-hosting. Owner: Dev Ad.
#   docker compose --project-directory . -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.prod.yml pull && up -d
# Images come from GHCR (built by .github/workflows/deploy.yml). Caddy terminates TLS for
# app.$DOMAIN serves the frontend, with /api/ws proxied to battlefield.
# red.$DOMAIN and blue.$DOMAIN are admin-only backstage aliases.
# No secrets and no build args here. /opt/redledger/.env is rendered by deploy/render-env.sh from
# the GitHub `production` environment on every deploy; the `:?` entries below make compose refuse
# to start rather than fall back to the base file's change-me defaults.
services:
  battlefield:
    image: ghcr.io/${GITHUB_REPO}/battlefield:${IMAGE_TAG:-latest}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN unset; run deploy/render-env.sh}
      AGENT_TOKEN_RED: ${AGENT_TOKEN_RED:?AGENT_TOKEN_RED unset; run deploy/render-env.sh}
      AGENT_TOKEN_GREEN: ${AGENT_TOKEN_GREEN:?AGENT_TOKEN_GREEN unset; run deploy/render-env.sh}
      AGENT_TOKEN_BLUE: ${AGENT_TOKEN_BLUE:?AGENT_TOKEN_BLUE unset; run deploy/render-env.sh}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?OPERATOR_TOKEN unset; run deploy/render-env.sh}
  red:
    image: ghcr.io/${GITHUB_REPO}/red:${IMAGE_TAG:-latest}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    environment:
      # this agent only ever holds its own token (contracts/agent-service.md "Tokens")
      AGENT_TOKEN: ${AGENT_TOKEN_RED:?AGENT_TOKEN_RED unset; run deploy/render-env.sh}
  green:
    image: ghcr.io/${GITHUB_REPO}/green:${IMAGE_TAG:-latest}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    environment:
      # this agent only ever holds its own token (contracts/agent-service.md "Tokens")
      AGENT_TOKEN: ${AGENT_TOKEN_GREEN:?AGENT_TOKEN_GREEN unset; run deploy/render-env.sh}
  blue:
    image: ghcr.io/${GITHUB_REPO}/blue:${IMAGE_TAG:-latest}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    environment:
      # this agent only ever holds its own token (contracts/agent-service.md "Tokens")
      AGENT_TOKEN: ${AGENT_TOKEN_BLUE:?AGENT_TOKEN_BLUE unset; run deploy/render-env.sh}
  frontend:
    image: ghcr.io/${GITHUB_REPO}/frontend:${IMAGE_TAG:-latest}
    build: !reset null
    ports: !reset []
    restart: unless-stopped
    environment:
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?OPERATOR_TOKEN unset; run deploy/render-env.sh}
  postgres:
    ports: !reset []
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [battlefield, frontend]
    networks: [edge]  # reaches battlefield + frontend only; never the agents or data networks

volumes:
  caddy_data:
  caddy_config:
