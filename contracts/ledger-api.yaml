  /preparations:
    post:
      summary: Prepare a gated green action. Validates, gates and persists the decision (and any block or escalation); never performs the action.
      description: |
        Keyed by X-Tool-Use-Id, which MUST be the SDK-reported tool_use_id of the live Droid call
        (battlefield binds it, it cannot verify it). The binding is (action, entity_id, amount ±1¢,
        args); the controller mode, day and a narrow state fingerprint of the entities the action
        reads are recorded with it.
        Same key + same action again returns the stored preparation unchanged: no new gate call, and
        a pending escalation is joined, never opened twice. A key already bound to a different action
        is a 409 and is never replayed.
        Returns 200 for a block as well: a block is a successful preparation (`effective: block`); in
        enforce the entity is already marked blocked and the verdict persisted, so a cancelled tool
        call loses nothing. Shadow and off always return `effective: allow`.
        In enforce an `escalate` verdict holds this request until a human decides or
        ESCALATION_TIMEOUT_SEC passes (timeout = block).
        Expiry is fixed at created_at + 120 s and never extended. Battlefield refuses to start unless
        ESCALATION_TIMEOUT_SEC + GATE_TIMEOUT_SEC + 15 ≤ 120.
        The gated route later called with the same X-Tool-Use-Id consumes the preparation (no second
        gate call) and refuses with 409 PreparationRejected when it was already consumed or is still
        pending; or, in every mode, when the binding, controller mode or day changed; or, in enforce
        only, when it expired or the state fingerprint drifted (shadow/off audit those and proceed).
        Every outcome is audited (`action = "prepare:<action>"`).
        A prepare call is not a ledger write of the tool call: it does not count toward the
        `<tool_use_id>:<n>` write counter, so the tool's first gated write still uses the bare id.
        State fingerprint (sha256 over current, provenance-stripped values; recomputed in the
        execution transaction):
          invoices.match: invoice{amount, vendor_id, po_id}, the proposed PO{vendor_id, amount, status}, vendor{status}
          invoices.approve|reject|pay: invoice{amount, vendor_id, po_id}, vendor{status, bank_account, bank_routing, name}, PO{vendor_id, amount, status} or null
          vendor_changes.approve|reject: change{vendor_id, field, new_value}, vendor{status, the value of `field`}
          expenses.approve|pay: expense{amount, employee_id}, employee{status, bank_account, hr_record}
          gl.post: none (the args are the whole action)
        The subject entity's own `status` is excluded (the route's compare-and-set guards it, and
        approve-then-pay prepared back to back must not go stale), and so are history lists (paid
        invoices, recent changes), so one invoice's payment never invalidates a sibling's preparation.
        Restart: battlefield's startup recovery sets every `pending` preparation to
        `effective: block, decided_by: timeout`; expiry is wall-clock, so it survives restarts.
      x-agents: [green]
      security: [ { agentBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/XAgent' }, { $ref: '#/components/parameters/XEpisode' }, { $ref: '#/components/parameters/XDay' }, { $ref: '#/components/parameters/XToolUseId' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PreparationCreate' } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Preparation' } } } }
        '404': { description: entity or referenced PO not found }
        '409': { description: "{error: 'invalid_state', detail} (the gated route's own state checks, e.g. invoice already paid) | {error: 'idempotency key reused for a different action', verdict_id} | {error: 'no active turn for this agent'}", content: { application/json: { schema: { $ref: '#/components/schemas/ConflictError' } } } }
        '422': { description: unknown action or invalid body }
  /preparations/{key}:
    get:
      summary: Read a preparation by its idempotency key (e.g. to reconcile a tool whose outcome is unknown, without retrying it).
      x-agents: [green]
      security: [ { agentBearer: [] } ]
      parameters: [ { name: key, in: path, required: true, schema: { type: string } } ]
