  /replays/{id}/play:
    post:
      security: [ { operatorBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      description: |
        Plays a recorded fixture as a new, real episode: battlefield creates an `episodes` row with
        id `episode_id` (default `replay_<fixture>_<8hex>`) and persists every fixture event under it
        with fresh ids and timestamps, paced by the original gaps ÷ `speed` (≤ 3 s per gap; speed ≤ 0
        = no pacing). So `GET /events`, `/ws` `after_id` catch-up and the event-derived `/fe` views
        work for replays; table-derived `/fe` views are empty (a replay writes no ledger rows).
        Runner routes (start/pause/resume/step/controller/attack) return 409 for `replay_*` episodes.
      requestBody: { content: { application/json: { schema: { type: object, properties: { speed: { type: number, default: 1.0 }, episode_id: { type: string, pattern: '^replay_[A-Za-z0-9_-]{1,57}$', description: 'id for the new replay episode; must not exist' } } } } } }
