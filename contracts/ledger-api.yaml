openapi: 3.1.0
info:
  title: Red Ledger — Battlefield API
  version: 0.1.0
  description: |
    The only interface to the books. Agents (red/green/blue) and the frontend call this.
    Two bearer tokens, chosen by whether the request carries `X-Agent`:
      - `agentBearer` (the claimed agent's own token, `AGENT_TOKEN_<A>`): required on every request
        that carries `X-Agent: <a>`. Battlefield holds all three; each agent holds only its own.
      - `operatorBearer` (`OPERATOR_TOKEN`): required on every request without `X-Agent`.
        Held by battlefield, the frontend *server* (never the browser), Makefile/curl, the owner.
    Wrong token for the role → 401: `OPERATOR_TOKEN` + `X-Agent` → 401; another agent's token for
    the claimed `X-Agent` → 401 (audited, operator-only, when the token belongs to a known caller; an unknown token is only logged); any agent token without `X-Agent` → 401. A correctly authenticated agent calling a route its role may not use → 403
    (e.g. any agent on `GET /events` or a control-plane route).
    Transition: each `AGENT_TOKEN_<A>` falls back to the shared `AGENT_TOKEN`, then `INTERNAL_TOKEN`
    (battlefield warns that per-agent separation is off); `OPERATOR_TOKEN` falls back to
    `INTERNAL_TOKEN`. Battlefield warns whenever any two resolved tokens (the three agent tokens and
    `OPERATOR_TOKEN`) are equal, from any source; the prod deploy refuses equal values. See contracts/agent-service.md Tokens.
    Per-operation `security` below says which token(s) a route accepts. A route listing both
    accepts either: an agent with `X-Agent` + its own token, or the operator without `X-Agent`
    + `OPERATOR_TOKEN`.
    Not every route is listed here. Every `/fe/*` route (frontend.py reads, `/fe/query`,
    `/fe/episodes/{id}/state/{agent}`) is operatorBearer. `/x/{area}/...` extension routes set
    their own auth; `fe_*` extension routes may be deliberately public (no token).
    `/ws` authenticates by query string (`ticket` or `token`), not by header; see `/ws/ticket`.
    Agent routes additionally require X-Agent, X-Episode, X-Day, and (for writes) X-Tool-Use-Id.
    Battlefield enforces per-agent route permissions (403 on violation) and strips `origin`
    and `attack_id` from every response to an X-Agent caller.
    Any agent write outside that agent's active turn → 409 {error: 'no active turn for this agent'}
    (audited). Reads are always allowed.
    At most one active run per battlefield. Active = any non-replay episode with status `running`, an episode
    being stepped, or a lineage with status `running` (a running lineage's own generation episodes are part of
    its run). `POST /episodes/{id}/start|resume|step` and `POST /lineages/{id}/start|resume` while another run is
    active → 409 {error: 'another run is active', episode_id: <active episode|null>, lineage_id: <active lineage|null>}.
    Resuming the active run itself is allowed; replays (`POST /replays/{id}/play`) never count.
    Green's gated actions may be prepared first (`POST /preparations`, keyed by the SDK
    tool_use_id): battlefield gates and persists the decision, and the gated route later consumes
    it. Without a preparation a gated route gates inline. Agents MUST send only SDK-reported
    tool_use_ids from live Droid sessions; battlefield binds a key, it cannot verify it.
servers:
  - url: http://battlefield:8000/api

components:
  securitySchemes:
    agentBearer:
      type: http
      scheme: bearer
      description: 'The claimed agent''s own token `AGENT_TOKEN_<A>` (per agent; falls back to the shared `AGENT_TOKEN`, then `INTERNAL_TOKEN`, when unset). Required on, and only valid on, requests carrying `X-Agent`; another agent''s token → 401.'
    operatorBearer:
      type: http
      scheme: bearer
      description: '`OPERATOR_TOKEN` (falls back to `INTERNAL_TOKEN` when unset). Required on, and only valid on, requests without `X-Agent`. Never shipped to a browser.'
  parameters:
    XAgent:     { name: X-Agent, in: header, required: true, schema: { type: string, enum: [red, green, blue] } }
    XEpisode:   { name: X-Episode, in: header, required: true, schema: { type: string } }
    XDay:       { name: X-Day, in: header, required: true, schema: { type: integer } }
    XToolUseId: { name: X-Tool-Use-Id, in: header, required: true, schema: { type: string }, description: "idempotency key (Droid tool_use_id; n-th write of one tool call is <tool_use_id>:<n>). On gated green routes a key already judged for a different action/entity/amount gets 409 {error: 'idempotency key reused for a different action'} and is never replayed." }
    id:         { name: id, in: path, required: true, schema: { type: string } }
  schemas:
    Money: { type: number, format: double }
    Vendor:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        ein: { type: string, nullable: true }
        bank_account: { type: string }
        bank_routing: { type: string }
        address: { type: string, nullable: true }
        category: { type: string, nullable: true }
        created_day: { type: integer }
        status: { type: string, enum: [active, frozen] }
    VendorCreate:
      type: object
      required: [name, bank_account, bank_routing]
      properties:
        name: { type: string }
        ein: { type: string }
        bank_account: { type: string }
        bank_routing: { type: string }
        address: { type: string }
        category: { type: string }
    VendorChange:
      type: object
      properties:
        id: { type: string }
        vendor_id: { type: string }
        field: { type: string, enum: [bank_account, bank_routing, address, name] }
        old_value: { type: string, nullable: true }
        new_value: { type: string }
        justification: { type: string, nullable: true }
        requested_day: { type: integer }
        status: { type: string, enum: [pending, approved, rejected, blocked] }
    VendorChangeCreate:
      type: object
      required: [vendor_id, field, new_value]
      properties:
        vendor_id: { type: string }
        field: { type: string, enum: [bank_account, bank_routing, address, name] }
        new_value: { type: string }
        justification: { type: string }
    Employee:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        department: { type: string, nullable: true }
        salary: { $ref: '#/components/schemas/Money' }
        bank_account: { type: string }
        start_day: { type: integer }
        status: { type: string }
        hr_record: { type: boolean }
    EmployeeCreate:
      type: object
      required: [name, role, salary, bank_account]
      properties:
        name: { type: string }
        role: { type: string }
        department: { type: string }
        salary: { $ref: '#/components/schemas/Money' }
        bank_account: { type: string }
    PurchaseOrder:
      type: object
      properties:
        id: { type: string }
        vendor_id: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        description: { type: string, nullable: true }
        created_day: { type: integer }
        status: { type: string, enum: [open, fulfilled, closed] }
    Invoice:
      type: object
      properties:
        id: { type: string }
        vendor_id: { type: string }
        po_id: { type: string, nullable: true }
        amount: { $ref: '#/components/schemas/Money' }
        invoice_number: { type: string }
        line_items: { type: array, items: { type: object } }
        received_day: { type: integer }
        due_day: { type: integer }
        status: { type: string, enum: [pending, matched, approved, paid, rejected, blocked] }
    InvoiceCreate:
      type: object
      required: [vendor_id, amount, invoice_number]
      properties:
        vendor_id: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        invoice_number: { type: string }
        po_id: { type: string }
        line_items: { type: array, items: { type: object } }
        due_in_days: { type: integer, default: 30 }
    Payment:
      type: object
      properties:
        id: { type: string }
        invoice_id: { type: string, nullable: true }
        expense_id: { type: string, nullable: true }
        amount: { $ref: '#/components/schemas/Money' }
        to_account: { type: string }
        paid_day: { type: integer }
        paid_by: { type: string }
    Expense:
      type: object
      properties:
        id: { type: string }
        employee_id: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        category: { type: string }
        memo: { type: string, nullable: true }
        submitted_day: { type: integer }
        status: { type: string }
    ExpenseCreate:
      type: object
      required: [employee_id, amount, category]
      properties:
        employee_id: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        category: { type: string }
        memo: { type: string }
    BankTransaction:
      type: object
      properties:
        id: { type: string }
        day: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
        counterparty: { type: string, nullable: true }
        memo: { type: string, nullable: true }
        matched_payment_id: { type: string, nullable: true }
    GlEntry:
      type: object
      properties:
        id: { type: string }
        day: { type: integer }
        account: { type: string }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        memo: { type: string, nullable: true }
        posted_by: { type: string }
    GlEntryCreate:
      type: object
      required: [account]
      properties:
        account: { type: string }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        memo: { type: string }
        ref_type: { type: string }
        ref_id: { type: string }
    Flag:
      type: object
      properties:
        id: { type: string }
        day: { type: integer }
        entity_type: { type: string }
        entity_id: { type: string }
        severity: { type: string, enum: [low, medium, high] }
        reason: { type: string }
    FlagCreate:
      type: object
      required: [entity_type, entity_id, severity, reason]
      properties:
        entity_type: { type: string }
        entity_id: { type: string }
        severity: { type: string, enum: [low, medium, high] }
        reason: { type: string }
    AttackCreate:
      type: object
      required: [scheme_id, display_name, story, target_amount]
      properties:
        scheme_id: { type: string }
        display_name: { type: string }
        story: { type: string }
        params: { type: object }
        target_amount: { $ref: '#/components/schemas/Money' }
    Attack:
      allOf:
        - $ref: '#/components/schemas/AttackCreate'
        - type: object
          properties:
            id: { type: string }
            day_launched: { type: integer }
            outcome: { type: string }
            amount_extracted: { $ref: '#/components/schemas/Money' }
            detected_day: { type: integer, nullable: true }
            created_at: { type: string, format: date-time, description: "declaration time; orders same-day attacks" }
            resolved_day: { type: integer, nullable: true, description: "first day the attack was resolved (outcome failed, or entities and none pending)" }
            revealed_day: { type: integer, nullable: true, description: "lineage episodes: day a debrief first revealed it; outcome, amount_extracted and detected_day are frozen from then on" }
    Reason:
      type: object
      properties: { reason: { type: string } }
    GateBlocked:
      type: object
      properties:
        verdict: { type: string, enum: [block] }
        reason: { type: string }
        verdict_id: { type: string }
        escalation_id: { type: string, nullable: true }
        cause: { type: string, enum: [control, gate_unavailable], nullable: true, description: "control = blue evaluated the supplied context; gate_unavailable = blue timed out or failed (fallback verdict)" }
        decided_by: { type: string, enum: [gate, human, timeout], nullable: true }
        preparation_id: { type: string, nullable: true }
    PreparationCreate:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [invoices.match, invoices.approve, invoices.reject, invoices.pay, vendor_changes.approve, vendor_changes.reject, expenses.approve, expenses.pay, gl.post] }
        entity_id: { type: string, description: "required except for gl.post" }
        args: { type: object, description: "the exact body the execution will send (gl.post: the GlEntryCreate body)" }
    Preparation:
      type: object
      required: [preparation_id, idempotency_key, controller_mode, day, action, effective, decided_by, expires_at, consumed]
      properties:
        preparation_id: { type: string }
        idempotency_key: { type: string, description: "X-Tool-Use-Id of the prepare call = the first write key of the tool call" }
        controller_mode: { type: string, enum: [off, shadow, enforce] }
        day: { type: integer }
        action: { type: string }
        entity_type: { type: string, nullable: true }
        entity_id: { type: string, nullable: true }
        amount: { type: number, format: double, nullable: true, description: "null for gl.post and vendor_changes.*" }
        effective: { type: string, enum: [allow, block, pending], description: "what execution under this key will do; shadow and off always allow" }
        enforced: { type: boolean }
        decided_by: { type: string, enum: [mode, gate, human, timeout], nullable: true, description: "null exactly while effective is pending (an enforced escalation is still held); mode = off (no gate call); gate = blue's verdict decided it, including shadow, where blue answered but effective is always allow; human / timeout = an enforced escalation was resolved / expired" }
        verdict_id: { type: string, nullable: true, description: "null in off" }
        verdict: { type: string, enum: [allow, block, escalate], nullable: true }
        cause: { type: string, enum: [control, gate_unavailable], nullable: true }
        reason: { type: string }
        rules_fired: { type: array, items: { type: string } }
        escalation_id: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, description: "created_at + 120 s; never extended, not even by a human decision" }
        consumed: { type: boolean }
        consumed_status: { type: integer, nullable: true }
    ConflictError:
      type: object
      description: "A 409 that is not a PreparationRejected: entity state (`{detail: 'invoice is paid'}`), an idempotency key reused for a different action (`{error, verdict_id}`), or an agent write outside its active turn (`{error: 'no active turn for this agent'}`)."
      properties:
        error: { type: string }
        detail: { type: string }
        verdict_id: { type: string }
    PreparationRejected:
      type: object
      required: [error, preparation_id]
      properties:
        error: { type: string, enum: [preparation_expired, preparation_stale, preparation_consumed, preparation_pending] }
        preparation_id: { type: string }
        detail: { type: string, description: "e.g. 'mode changed', 'day changed', 'state changed: vendor.bank_account'" }
        consumed_status: { type: integer, nullable: true, description: "preparation_consumed: the status the consuming call returned" }
    Episode:
      type: object
      properties:
        id: { type: string }
        seed: { type: integer }
        controller_mode: { type: string, enum: [off, shadow, enforce] }
        days: { type: integer }
        status: { type: string }
        current_day: { type: integer }
        lineage_id: { type: string, nullable: true }
        generation: { type: integer, nullable: true }
    EpisodeCreate:
      type: object
      required: [controller_mode]
      properties:
        seed: { type: integer }
        controller_mode: { type: string, enum: [off, shadow, enforce] }
        days: { type: integer, default: 10 }
        attack_plan:
          type: array
          items: { type: object, properties: { day: { type: integer }, scheme_id: { type: string }, params: { type: object } } }
        lineage_id:
          type: string
          description: |
            Run this episode as the lineage's next generation (generation = current_generation + 1), with
            the agents' latest playbooks, daily debriefs and the lineage's reveal window. This is how the
            real-time demo runs evolved agents: such an episode is never headless (human escalations,
            DAY_PAUSE_SEC as usual). `seed` must not be a seed any episode of the lineage used; omitted →
            `base_seed + generation`. The lineage must be finished or failed (409 while it is created,
            running or paused: its runner owns generation creation).
    Score:
      type: object
      properties:
        dollars_extracted: { $ref: '#/components/schemas/Money' }
        dollars_blocked: { $ref: '#/components/schemas/Money' }
        false_positive_cost: { $ref: '#/components/schemas/Money' }
        detection_latency_days: { type: number, nullable: true }
        attacks_launched: { type: integer }
        attacks_caught: { type: integer }
        legit_blocked: { type: integer }
        legit_processed: { type: integer }
    Event:
      type: object
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        episode_id: { type: string }
        day: { type: integer }
        type: { type: string }
        agent: { type: string, nullable: true }
        payload: { type: object }
    AgentEventCreate:
      type: object
      required: [type, payload]
      properties:
        type: { type: string, enum: [agent.thinking, agent.tool_call, agent.tool_result] }
        payload: { type: object }
    WsTicketCreate:
      type: object
      properties:
        episode_id: { type: string, description: 'episode the ticket is scoped to; omit for a ticket valid on any episode (scope `*`)' }
    WsTicket:
      type: object
      required: [ticket, expires_at]
      properties:
        ticket: { type: string, description: 'opaque to clients; pass verbatim as `/ws?ticket=`' }
        expires_at: { type: string, format: date-time, description: 'ISO 8601; issue time + 60 s' }
    LineageConfig:
      type: object
      description: Validated by battlefield (agentkit.models.LineageConfig). Unknown keys → 422.
      properties:
        generations: { type: integer, minimum: 1, default: 3, description: generations the lineage runner creates }
        days: { type: integer, minimum: 1, default: 6 }
        controller_mode: { type: string, enum: [off, shadow, enforce], default: enforce }
        reveal_days: { type: integer, minimum: 0, default: 3, description: 'debrief window: resolved items of the last N completed days (0 = no daily reveal)' }
        reveal_generations: { type: integer, minimum: 0, default: 2, description: 'after-action review window: the finished generation plus summaries of the N-1 before it (0 = no review)' }
        headless:
          type: object
          nullable: true
          description: applies to the generations the lineage runner creates; never to an episode made by POST /episodes {lineage_id}
          properties:
            day_pause_sec: { type: number, minimum: 0, default: 0 }
            escalation_policy: { type: string, enum: [block], default: block, description: how an unanswered escalation resolves (today's timeout semantics) }
            escalation_timeout_sec: { type: integer, minimum: 1, default: 5, description: 'must be ≤ ESCALATION_TIMEOUT_SEC' }
          default: { day_pause_sec: 0, escalation_policy: block, escalation_timeout_sec: 5 }
        max_credits: { type: number, minimum: 0, default: 0, description: 'cap on summed factory_credits over the lineage (turns + reflections); 0 = off' }
    LineageCreate:
      type: object
      properties:
        name: { type: string }
        base_seed: { type: integer, description: 'omitted → random' }
        config: { $ref: '#/components/schemas/LineageConfig' }
    Lineage:
      type: object
      properties:
        id: { type: string, description: 'ln_…' }
        name: { type: string }
        base_seed: { type: integer }
        config: { $ref: '#/components/schemas/LineageConfig' }
        status: { type: string, enum: [created, running, paused, finished, failed] }
        current_generation: { type: integer }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        generations:
          type: array
          items:
            type: object
            properties:
              generation: { type: integer }
              episode_id: { type: string }
              seed: { type: integer }
              status: { type: string }
              score: { $ref: '#/components/schemas/Score' }
        playbook_versions:
          type: object
          description: latest version per agent
          properties: { red: { type: integer }, green: { type: integer }, blue: { type: integer } }
    Playbook:
      type: object
      required: [version, generation, source, content, rationale]
      properties:
        version: { type: integer }
        parent_version: { type: integer, nullable: true }
        generation: { type: integer }
        episode_id: { type: string, nullable: true }
        day: { type: integer, nullable: true }
        source: { type: string, enum: [seed, turn, reflect, operator] }
        content: { type: object, description: 'opaque to battlefield; ≤ 64 KiB serialized' }
        rationale: { type: string }
        created_at: { type: string, format: date-time }
    PlaybookPut:
      type: object
      required: [content, base_version]
      properties:
        content: { type: object }
        rationale: { type: string, default: '' }
        base_version: { type: integer, description: version this write is based on; must be the latest }
    Escalation:
      type: object
      properties:
        id: { type: string }
        verdict_id: { type: string }
        status: { type: string }
        expires_at: { type: string, format: date-time }
        action: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string }

# Default for any operation that does not override it: operator only. Agent and dual-role
# routes override explicitly below.
security: [ { operatorBearer: [] } ]

paths:
  # ---------- reads (all agents + frontend) ----------
  # Reads accept either token: agent with X-Agent + its own token, operator without X-Agent + OPERATOR_TOKEN.
  /vendors:
    get:
      summary: List vendors
      security: [ { agentBearer: [] }, { operatorBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/XAgent' }, { $ref: '#/components/parameters/XEpisode' }, { $ref: '#/components/parameters/XDay' },
                    { name: status, in: query, schema: { type: string } } ]
      responses: { '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Vendor' } } } } } }
    post:
      summary: Create vendor (red)
      x-agents: [red]
      security: [ { agentBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/XAgent' }, { $ref: '#/components/parameters/XEpisode' }, { $ref: '#/components/parameters/XDay' }, { $ref: '#/components/parameters/XToolUseId' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VendorCreate' } } } }
      responses: { '201': { content: { application/json: { schema: { $ref: '#/components/schemas/Vendor' } } } } }
  /vendors/{id}:
    get: { security: [ { agentBearer: [] }, { operatorBearer: [] } ], parameters: [ { $ref: '#/components/parameters/id' } ], responses: { '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Vendor' } } } } } }
  /vendors/{id}/freeze:
    post:
      x-agents: [blue]
      security: [ { agentBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses: { '200': { description: frozen } }
  /vendors/{id}/unfreeze:
    post: { x-agents: [blue], security: [ { agentBearer: [] } ], parameters: [ { $ref: '#/components/parameters/id' } ], responses: { '200': { description: unfrozen } } }

  /vendor_changes:
    get:
      security: [ { agentBearer: [] }, { operatorBearer: [] } ]
      parameters: [ { name: status, in: query, schema: { type: string } } ]
      responses: { '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VendorChange' } } } } } }
    post:
      x-agents: [red]
      security: [ { agentBearer: [] } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/VendorChangeCreate' } } } }
      responses: { '201': { content: { application/json: { schema: { $ref: '#/components/schemas/VendorChange' } } } } }
  /vendor_changes/{id}/approve:
    post: { x-agents: [green], x-gated: vendor_changes.approve, security: [ { agentBearer: [] } ], parameters: [ { $ref: '#/components/parameters/id' } ],
            responses: { '200': { description: approved }, '403': { content: { application/json: { schema: { $ref: '#/components/schemas/GateBlocked' } } } }, '409': { description: 'PreparationRejected (stale/expired/consumed/pending preparation), or ConflictError (entity state, idempotency key conflict, no active turn)', content: { application/json: { schema: { anyOf: [ { $ref: '#/components/schemas/PreparationRejected' }, { $ref: '#/components/schemas/ConflictError' } ] } } } } } }
  /vendor_changes/{id}/reject:
    post: { x-agents: [green], x-gated: vendor_changes.reject, security: [ { agentBearer: [] } ], parameters: [ { $ref: '#/components/parameters/id' } ],
            requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } },
