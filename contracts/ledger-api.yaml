  /lineages/{id}/start:
    post:
      summary: Run the lineage headless - for each generation create its episode, run it, then call every agent's POST /reflect.
      description: One lineage runs at a time per battlefield (agent services serve one turn at a time). A battlefield restart pauses a running lineage.
      security: [ { operatorBearer: [] } ]
      parameters: [ { $ref: '#/components/parameters/id' } ]
      responses:
