# Red Ledger — full stack. Owner: Dev Ad.
# Internal traffic is plain HTTP on the compose networks; TLS terminates at the edge (Caddy/Cloudflare).
# Networks (invariants 1, 4, 11): only battlefield joins more than one.
#   edge   — frontend (+ caddy in prod) ↔ battlefield. Agents are NOT here: the frontend's
#            /api/bf/* proxy carries OPERATOR_TOKEN, so an agent that could reach it could read
#            origin, /events, /attacks/all.
#   agents — red/green/blue ↔ battlefield (and green → blue mirror gate). Needs internet egress
#            for Factory/LLM APIs, so not internal.
#   data   — postgres ↔ battlefield only. Internal: no egress, no other service can reach the DB.
# Usage:
#   make up          -> this file (agents live, need FACTORY_API_KEY)
#   make up-dry      -> + docker-compose.dev.yml (agents DRY_RUN, hot reload)
#   make mock-agents -> + docker-compose.mock.yml (stub agents from battlefield image)

x-agent-env: &agent-env
  BATTLEFIELD_URL: http://battlefield:8000
  BLUE_URL: http://blue:8003
  # Agent-scope token: agent routes (X-Agent) and battlefield -> agent calls. Never the operator token.
  AGENT_TOKEN: ${AGENT_TOKEN:-change-me-agent}
  FACTORY_API_KEY: ${FACTORY_API_KEY:-}
  # Global default; each agent service below overrides it with DRY_RUN_<AGENT> when that is set
  # (e.g. red live while green and blue stay keyless). render-env.sh writes all three resolved.
  DRY_RUN: ${DRY_RUN:-false}
  TURN_TIMEOUT_SEC: ${TURN_TIMEOUT_SEC:-180}
  GATE_TIMEOUT_SEC: ${GATE_TIMEOUT_SEC:-8}
  # agentkit warns at startup if its tool cap (TURN_TIMEOUT_SEC - 20) can't cover an escalation hold
  ESCALATION_TIMEOUT_SEC: ${ESCALATION_TIMEOUT_SEC:-90}
  # the auto-approve line, same value battlefield uses (agentkit AgentSettings.approval_threshold)
  APPROVAL_THRESHOLD: ${APPROVAL_THRESHOLD:-5000}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: redledger
      POSTGRES_PASSWORD: redledger
      POSTGRES_DB: redledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redledger"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [data]
    ports:
      - "127.0.0.1:5432:5432"

  battlefield:
    build:
      context: .
      dockerfile: battlefield/Dockerfile
    environment:
      DATABASE_URL: postgresql://redledger:redledger@postgres:5432/redledger
      RED_URL: http://red:8001
      GREEN_URL: http://green:8002
      BLUE_URL: http://blue:8003
      AGENT_TOKEN: ${AGENT_TOKEN:-change-me-agent}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-change-me}
      MAX_CREDITS_PER_EPISODE: ${MAX_CREDITS_PER_EPISODE:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EPISODE_DEFAULT_DAYS: ${EPISODE_DEFAULT_DAYS:-10}
      TURN_TIMEOUT_SEC: ${TURN_TIMEOUT_SEC:-180}
      GATE_TIMEOUT_SEC: ${GATE_TIMEOUT_SEC:-8}
      ESCALATION_TIMEOUT_SEC: ${ESCALATION_TIMEOUT_SEC:-90}
      FP_PENALTY_RATE: ${FP_PENALTY_RATE:-0.02}
      APPROVAL_THRESHOLD: ${APPROVAL_THRESHOLD:-5000}
      DAY_PAUSE_SEC: ${DAY_PAUSE_SEC:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./battlefield/fixtures:/app/battlefield/fixtures
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, agents, data]
    ports:
      - "8000:8000"

  red:
    build:
      context: .
      dockerfile: red/Dockerfile
    environment:
      <<: *agent-env
      AGENT_NAME: red
      PORT: "8001"
      DRY_RUN: ${DRY_RUN_RED:-${DRY_RUN:-false}}
      DROID_MODEL: ${DROID_MODEL_RED:-}
      DROID_REASONING: ${DROID_REASONING_RED:-}
    depends_on: [battlefield]
    networks: [agents]
    ports: ["127.0.0.1:8001:8001"]

  green:
    build:
      context: .
      dockerfile: green/Dockerfile
    environment:
      <<: *agent-env
      AGENT_NAME: green
      PORT: "8002"
      DRY_RUN: ${DRY_RUN_GREEN:-${DRY_RUN:-false}}
      DROID_MODEL: ${DROID_MODEL_GREEN:-}
      DROID_REASONING: ${DROID_REASONING_GREEN:-}
    depends_on: [battlefield, blue]
    networks: [agents]
    ports: ["127.0.0.1:8002:8002"]

  blue:
    build:
      context: .
      dockerfile: blue/Dockerfile
    environment:
      <<: *agent-env
      AGENT_NAME: blue
      PORT: "8003"
      DRY_RUN: ${DRY_RUN_BLUE:-${DRY_RUN:-false}}
      DROID_MODEL: ${DROID_MODEL_BLUE:-}
      DROID_REASONING: ${DROID_REASONING_BLUE:-}
      BLUE_GATE_LLM_PROVIDER: ${BLUE_GATE_LLM_PROVIDER:-}
      BLUE_GATE_LLM_API_KEY: ${BLUE_GATE_LLM_API_KEY:-}
      BLUE_GATE_LLM_MODEL: ${BLUE_GATE_LLM_MODEL:-}
      APPROVAL_THRESHOLD: ${APPROVAL_THRESHOLD:-5000}
      CRS_USERNAME: ${CRS_USERNAME:-}
      CRS_PASSWORD: ${CRS_PASSWORD:-}
      # Legacy compatibility only; the CRS identity client uses the login credentials above.
      CRS_API_KEY: ${CRS_API_KEY:-}
    depends_on: [battlefield]
    networks: [agents]
    ports: ["127.0.0.1:8003:8003"]

  frontend:
    # No build args: the image carries no secrets or per-environment values. Everything below is
    # runtime env. BATTLEFIELD_URL and OPERATOR_TOKEN are read only by the Next server-side proxy
    # (/api/bf/*); they must never get a NEXT_PUBLIC_ prefix.
    build:
      context: ./frontend
    environment:
      BATTLEFIELD_URL: http://battlefield:8000
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-change-me}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      NEXT_PUBLIC_MOCK: ${NEXT_PUBLIC_MOCK:-false}
      # Cloudflare Access JWT check at the origin (frontend middleware). Blank = check disabled
      # (local dev); prod sets both, so a request that didn't pass our Access app gets 403.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
    depends_on: [battlefield]
    networks: [edge]
    ports: ["3000:3000"]

networks:
  edge: {}
  agents: {}
  data:
    internal: true

volumes:
  pgdata:
