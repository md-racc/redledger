# CI: lint + tests per service, path-filtered so a red PR doesn't run frontend tests. Owner: Dev Ad.
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      agentkit: ${{ steps.f.outputs.agentkit }}
      battlefield: ${{ steps.f.outputs.battlefield }}
      red: ${{ steps.f.outputs.red }}
      green: ${{ steps.f.outputs.green }}
      blue: ${{ steps.f.outputs.blue }}
      frontend: ${{ steps.f.outputs.frontend }}
      contracts: ${{ steps.f.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            agentkit: ['agentkit/**']
            battlefield: ['battlefield/**', 'docs/recordings/**', 'agentkit/**', 'contracts/**', '.env.example', 'docker-compose.yml', 'deploy/render-env.sh', '.github/workflows/deploy.yml', '.github/workflows/ci.yml', '.github/scripts/check_contracts.py']
            # extension files are owned by their prefix but run battlefield tests
            red: ['red/**', 'agentkit/**']
            green: ['green/**', 'agentkit/**']
            blue: ['blue/**', 'agentkit/**']
            frontend: ['frontend/**', 'contracts/**', 'docs/**']  # pitch/lenders/liveRuns tests read docs/
            contracts: ['contracts/**']

  contracts-guard:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: core contracts changes require a CHANGELOG entry (team extensions are exempt)
        shell: bash
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          git diff --name-only --no-renames -z "$BASE_REF"...HEAD | python3 .github/scripts/check_contracts.py

  python:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        svc: [agentkit, battlefield, red, green, blue]
    if: ${{ always() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    # Match the documented runtime and service images; runner Python defaults can drift.
    env:
      UV_PYTHON: '3.11'
    # DB-tier tests (battlefield) run against this; services skip them when TEST_DATABASE_URL is unset.
    # A service on a matrix job starts for every entry; that's ~10 s, accepted.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: redledger
          POSTGRES_PASSWORD: redledger
          POSTGRES_DB: redledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U redledger -d redledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: skip if unchanged
        id: skip
        run: echo "run=${{ needs.changes.outputs[matrix.svc] }}" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v3
        if: steps.skip.outputs.run == 'true'
      - name: lint
        if: steps.skip.outputs.run == 'true'
        run: uvx ruff check ${{ matrix.svc }} && uvx ruff format --check ${{ matrix.svc }}
      - name: lint contracts guard helper
        if: steps.skip.outputs.run == 'true' && matrix.svc == 'battlefield'
        run: uvx ruff check .github/scripts/check_contracts.py && uvx ruff format --check .github/scripts/check_contracts.py
      - name: test
        if: steps.skip.outputs.run == 'true'
        working-directory: ${{ matrix.svc }}
        env:
          TEST_DATABASE_URL: postgresql://redledger:redledger@localhost:5432/redledger
          # services import top-level modules (agent, server, tools) from their own dir
          PYTHONPATH: "."
        run: uv sync --extra dev && uv run pytest -q

  battlefield-timescale:
    # Same battlefield suite on the TimescaleDB image: events/audit_log become hypertables at startup
    # (app/timescale.py) and test_timescale_db.py must find them (EXPECT_TIMESCALE=1 fails instead of skipping).
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' && needs.changes.outputs.battlefield == 'true' }}
    runs-on: ubuntu-latest
    # Match the documented runtime and service images; runner Python defaults can drift.
    env:
      UV_PYTHON: '3.11'
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: redledger
          POSTGRES_PASSWORD: redledger
          POSTGRES_DB: redledger
          TIMESCALEDB_TELEMETRY: "off"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U redledger -d redledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: test on timescale
        working-directory: battlefield
        env:
          TEST_DATABASE_URL: postgresql://redledger:redledger@localhost:5432/redledger
          EXPECT_TIMESCALE: "1"
          PYTHONPATH: "."
        run: uv sync --extra dev && uv run pytest -q

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test --silent

  ownership-guard:
    # Compatibility check: keep this name while main branch protection requires it.
    # Team path ownership and mandatory devlog fragments ended after the hackathon.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: maintenance scope is reviewed in the PR
        run: echo "Team path restrictions and devlog requirements are retired; see GIT.md."
