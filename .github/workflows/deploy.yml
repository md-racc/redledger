# CD: on merge to main, build images → GHCR, then SSH to the Vultr VM and roll the stack. Owner: Dev Ad.
# Required repo secrets: VULTR_HOST, VULTR_USER (deploy), VULTR_SSH_KEY (private key).
# GHCR auth uses the built-in GITHUB_TOKEN; make the packages public or give the VM a read:packages PAT.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: { group: deploy, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: battlefield, context: ., dockerfile: battlefield/Dockerfile }
          - { name: red,         context: ., dockerfile: red/Dockerfile }
          - { name: green,       context: ., dockerfile: green/Dockerfile }
          - { name: blue,        context: ., dockerfile: blue/Dockerfile }
          - { name: frontend,    context: ./frontend, dockerfile: ./frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          build-args: |
            NEXT_PUBLIC_BATTLEFIELD_URL=${{ vars.NEXT_PUBLIC_BATTLEFIELD_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_INTERNAL_TOKEN=${{ secrets.NEXT_PUBLIC_INTERNAL_TOKEN }}

  roll:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/redledger
            git fetch --quiet origin main && git reset --hard origin/main
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --quiet
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f >/dev/null
            sleep 5 && curl -fsS http://localhost:8000/ && echo && docker compose ps
