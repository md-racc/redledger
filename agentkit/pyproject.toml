[project]
name = "agentkit"
version = "0.1.0"
description = "Red Ledger shared agent toolkit: ledger client, event emitter, Droid agent base, service factory."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "structlog>=24.1",
]

[project.optional-dependencies]
droid = ["droid-sdk[mcp]>=0.2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
