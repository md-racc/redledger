[project]
name = "blue"
version = "0.1.0"
description = "Red Ledger blue agent. Owner: Dev M."
requires-python = ">=3.11"
dependencies = [
  "agentkit",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "structlog>=24.1",
]

[project.optional-dependencies]
droid = ["droid-sdk[mcp]>=0.2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[tool.uv.sources]
agentkit = { path = "../agentkit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["*.py", "schemes", "gate", "audit", "prompts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
