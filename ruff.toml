# Shared lint config for every Python service. Owner: Dev Ad.
line-length = 160
target-version = "py311"
[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B904"]
[lint.isort]
known-first-party = ["agentkit", "app", "seed", "mock_agents", "schemes", "gate", "audit", "tools", "agent"]
