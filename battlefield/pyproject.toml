[project]
name = "battlefield"
version = "0.1.0"
description = "Red Ledger battlefield: Ledger API, orchestrator, gatekeeper, event bus, scoring. Owner: Dev Ad."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "structlog>=24.1",
  "faker>=26.0",
  "agentkit",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.uv.sources]
agentkit = { path = "../agentkit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "seed", "mock_agents", "extensions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
